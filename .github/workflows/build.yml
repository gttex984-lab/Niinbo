name: compilar-nimbo
on: [workflow_dispatch, push]
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: Dependencias
        run: sudo apt-get update && sudo apt-get install -y build-essential git wget texinfo flex bison libgmp-dev libmpfr-dev libmpc-dev libtool autoconf automake
      - name: Restaurar toolchain
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: /usr/local/xenon
          key: xenon-toolchain-v2
      - name: Construir toolchain libxenon
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/Free60Project/libxenon.git
          cd libxenon/toolchain
          sudo mkdir -p /usr/local/xenon && sudo chown $USER /usr/local/xenon
          ./build-xenon-toolchain toolchain
          ./build-xenon-toolchain libxenon
          ./build-xenon-toolchain libs
      - name: Ajustar permissoes
        if: steps.cache.outputs.cache-hit != 'true'
        run: sudo chown -R $USER /usr/local/xenon && sudo chmod -R a+rX /usr/local/xenon
      - name: Guardar toolchain
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /usr/local/xenon
          key: xenon-toolchain-v2
      - name: Baixar stb_image
        run: wget -O client/src/stb_image.h https://raw.githubusercontent.com/nothings/stb/master/stb_image.h
      - name: Diagnostico de rede
        run: |
          {
            echo '## Diagnostico de rede'
            echo '```'
            find /usr/local/xenon -iname '*socket*' | head -20
            echo '--- cabecalhos network ---'
            find /usr/local/xenon -path '*network*' -name '*.h' | head -20
            echo '--- sockaddr_in ---'
            grep -rl 'sockaddr_in' /usr/local/xenon --include=*.h | head -20
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Compilar o cliente
        run: |
          export DEVKITXENON=/usr/local/xenon
          export PATH=$PATH:$DEVKITXENON/bin
          make -C client
      - name: Guardar o resultado
        uses: actions/upload-artifact@v4
        with:
          name: nimbo-cliente
          path: client/*.elf*
