name: compilar-nimbo
on: [workflow_dispatch, push]
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: Dependencias
        run: sudo apt-get update && sudo apt-get install -y build-essential git wget texinfo flex bison libgmp-dev libmpfr-dev libmpc-dev libtool autoconf automake
      - name: Preparar pasta da toolchain
        run: sudo mkdir -p /usr/local/xenon && sudo chown -R $USER /usr/local/xenon
      - name: Restaurar toolchain
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: /usr/local/xenon
          key: xenon-toolchain-v2
      - name: Construir toolchain libxenon
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/Free60Project/libxenon.git
          cd libxenon/toolchain
          ./build-xenon-toolchain toolchain
          ./build-xenon-toolchain libxenon
          ./build-xenon-toolchain libs
      - name: Baixar stb_image
        run: wget -O client/src/stb_image.h https://raw.githubusercontent.com/nothings/stb/master/stb_image.h
      - name: Compilar o cliente
        run: |
          X=/usr/local/xenon
          export PATH=$PATH:$X/bin
          {
            echo '## Diagnostico'
            echo '```'
            echo '--- xenon/lib ---'
            ls $X/xenon/lib | head -30
            echo '--- xenon/lib/32 ---'
            ls $X/xenon/lib/32 2>&1 | head -30
            echo '--- libc.a ---'
            find $X -name libc.a | head -10
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          set +e
          xenon-gcc -O2 -Wall -m32 -mno-altivec -mhard-float -mpowerpc64 -fno-pic -DXENON -I$X/usr/include \
            -o client/nimbo.elf client/src/main.c client/src/ws.c client/src/platform_xenon.c \
            -n -T $X/app.lds -L$X/usr/lib -L$X/xenon/lib/32 -lxenon -lm > build.log 2>&1
          code=$?
          { echo '## Log da compilacao'; echo '```'; tail -40 build.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $code
      - name: Guardar o resultado
        uses: actions/upload-artifact@v4
        with:
          name: nimbo-cliente
          path: client/*.elf*
