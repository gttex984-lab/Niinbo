name: compilar-nimbo
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: Dependencias
        run: sudo apt-get update && sudo apt-get install -y build-essential git wget texinfo flex bison libgmp-dev libmpfr-dev libmpc-dev libtool autoconf automake libjpeg-dev
      - name: Cache da toolchain
        id: cache
        uses: actions/cache@v4
        with: { path: /usr/local/xenon, key: xenon-toolchain-v1 }
      - name: Construir toolchain libxenon
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/Free60Project/libxenon.git
          cd libxenon/toolchain
          sudo mkdir -p /usr/local/xenon && sudo chown $USER /usr/local/xenon
          ./build-xenon-toolchain toolchain
          ./build-xenon-toolchain libxenon
          ./build-xenon-toolchain libs
      - name: Compilar o cliente
        run: |
          export DEVKITXENON=/usr/local/xenon
          export PATH=$PATH:$DEVKITXENON/bin
          make -C client
      - uses: actions/upload-artifact@v4
        with: { name: nimbo-cliente, path: "client/*.elf*" }
